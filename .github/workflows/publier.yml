name: Publication PyPI

# Publie le paquet sur PyPI à chaque release GitHub (tag vX.Y.Z), par « trusted publishing » :
# aucun jeton à stocker. Réglage unique sur pypi.org : Your projects > Publishing >
# Add a new pending publisher (dépôt DylaneTrader/brvm-py, workflow publier.yml, environnement pypi).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
